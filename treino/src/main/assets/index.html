<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#7a3a26;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
// ===== motor do mini-jogo (física + fases). Coordenadas lógicas: largura 1080 =====
const BX = 6, EHW = 46, EHH = 88, SPEED = 2400, DT = 1 / 480, MAXB = 3, BLAST = 230;
const mv = (a, amp, sp, ph = 0) => ({ a, amp, sp, ph });
// blocos [x0,y0,x1,y1,mv?]; atirador [x, pé]; alvos {x,y(pé),t:'e'|'x', m?}
const E = (x, y, m) => ({ x, y, t: 'e', m });
const X = (x, y) => ({ x, y, t: 'x' });
const LEVELS = [
  { n: '1-1', arena: [90, 600, 990, 1450], open: {}, blocks: [[470, 1100, 610, 1450]], shooter: [250, 1450], targets: [E(800, 1450)] },
  { n: '1-2', arena: [90, 600, 990, 1450], open: {}, blocks: [[450, 1160, 620, 1450], [270, 1085, 810, 1170]], shooter: [770, 1450], targets: [E(290, 1450)] },
  { n: '1-3', arena: [0, 500, 860, 1500], open: { l: 1 }, blocks: [[0, 1150, 360, 1200]], shooter: [620, 1500], targets: [E(150, 1150), E(110, 1500)] },
  { n: '1-4', arena: [90, 700, 990, 1450], open: {}, blocks: [[300, 1150, 380, 1450], [700, 1150, 780, 1450]], shooter: [540, 1450], targets: [E(190, 1450), E(890, 1450)] },
  { n: '1-5', arena: [90, 0, 1050, 1620], open: { t: 1 }, blocks: [[90, 0, 350, 1620], [640, 810, 900, 1620]], shooter: [480, 1620], targets: [E(770, 810)] },
  { n: '1-6', arena: [90, 800, 990, 1450], open: {}, blocks: [[450, 1150, 560, 1450]], shooter: [200, 1450], targets: [E(760, 1450, mv('x', 150, 1.2))] },
  { n: '1-7', arena: [90, 600, 990, 1450], open: {}, blocks: [[400, 1000, 470, 1450], [600, 1250, 990, 1300, mv('y', 120, 1.0)]], shooter: [220, 1450], targets: [E(800, 1250, mv('y', 120, 1.0))] },
  { n: '1-8', arena: [0, 700, 1080, 1450], open: { l: 1, r: 1 }, blocks: [[330, 1050, 750, 1110]], shooter: [540, 1450], targets: [E(90, 1450), E(990, 1450)] },
  { n: '1-9', arena: [90, 0, 990, 1450], open: { t: 1 }, blocks: [[300, 1100, 420, 1450], [640, 1150, 760, 1450], [700, 760, 990, 820]], shooter: [520, 1450], targets: [E(880, 1450), E(360, 1100)] },
  { n: '1-10', arena: [300, 950, 780, 1400], open: {}, blocks: [[500, 1250, 580, 1400]], shooter: [360, 1400], targets: [E(700, 1400), X(450, 1250)] },
  { n: '1-11', arena: [60, 1150, 1020, 1450], open: {}, blocks: [[300, 1250, 380, 1450], [560, 1250, 640, 1450], [800, 1250, 880, 1450]], shooter: [150, 1450], targets: [E(470, 1450), E(720, 1450), E(950, 1450)] },
  { n: '1-12', arena: [90, 700, 990, 1450], open: {}, blocks: [[400, 1200, 520, 1450]], shooter: [200, 1450], targets: [X(780, 1450), E(700, 1450), E(880, 1450)] },
  { n: '1-13', arena: [0, 500, 1080, 1500], open: { l: 1, r: 1 }, blocks: [[200, 1100, 500, 1150], [600, 900, 900, 950, mv('x', 100, 0.9)]], shooter: [540, 1500], targets: [E(350, 1100), E(750, 900, mv('x', 100, 0.9))] },
  { n: '1-14', arena: [90, 600, 990, 1450], open: {}, blocks: [[250, 1000, 330, 1450], [470, 800, 550, 1450], [690, 1000, 770, 1450]], shooter: [170, 1450], targets: [E(880, 1450)] },
];
const off = (b, t) => !b[4] ? b : b[4].a === 'x' ? [b[0] + b[4].amp * Math.sin(b[4].sp * t + b[4].ph), b[1], b[2] + b[4].amp * Math.sin(b[4].sp * t + b[4].ph), b[3]]
  : [b[0], b[1] + b[4].amp * Math.sin(b[4].sp * t + b[4].ph), b[2], b[3] + b[4].amp * Math.sin(b[4].sp * t + b[4].ph)];
const blocksAt = (L, t) => L.blocks.map(b => off(b, t));
const tpos = (e, t) => !e.m ? [e.x, e.y] : e.m.a === 'x' ? [e.x + e.m.amp * Math.sin(e.m.sp * t + e.m.ph), e.y] : [e.x, e.y + e.m.amp * Math.sin(e.m.sp * t + e.m.ph)];
const sky = L => { const a = L.arena, o = L.open; return [o.l ? -200 : a[0], o.t ? -200 : a[1], o.r ? 1280 : a[2], a[3]]; };
// dead[i] = instante da morte (ou undefined). Devolve caminho, mortes {i,t} e destino final.
function simulate(L, t0, o, ang, dead) {
  const S = sky(L); let x = o[0], y = o[1], dx = Math.cos(ang), dy = Math.sin(ang), t = t0, b = 0;
  const path = [[x, y]], kills = [], gone = new Set(); const dd = dead || [];
  const alive = i => dd[i] === undefined && !gone.has(i);
  for (let s = 0; s < 6000; s++) {
    const nx = x + dx * SPEED * DT, ny = y + dy * SPEED * DT; t += DT;
    let fx = false, fy = false;
    if (nx < S[0] || nx > S[2]) { if (nx < S[0] ? L.open.l : L.open.r) { path.push([nx, ny]); break; } fx = true; }
    if (ny < S[1]) { if (L.open.t) { path.push([nx, ny]); break; } fy = true; } else if (ny > S[3]) fy = true;
    for (const k of blocksAt(L, t)) if (nx > k[0] - BX && nx < k[2] + BX && ny > k[1] - BX && ny < k[3] + BX) {
      const ix = x <= k[0] - BX || x >= k[2] + BX, iy = y <= k[1] - BX || y >= k[3] + BX;
      if (ix && !iy) fx = true; else if (iy && !ix) fy = true; else { fx = true; fy = true; }
    }
    if (fx || fy) { if (++b > MAXB) { path.push([x, y]); break; } if (fx) dx = -dx; if (fy) dy = -dy; path.push([x, y]); continue; }
    x = nx; y = ny;
    L.targets.forEach((e, i) => {
      if (!alive(i)) return; const p = tpos(e, t);
      if (Math.abs(x - p[0]) < EHW + BX && y > p[1] - 2 * EHH - BX && y < p[1] + BX) {
        kills.push({ i, t }); gone.add(i);
        if (e.t === 'x') L.targets.forEach((f, j) => { if (j !== i && alive(j)) { const q = tpos(f, t); if (Math.hypot(q[0] - p[0], q[1] - p[1] + EHH) < BLAST) { kills.push({ i: j, t }); gone.add(j); } } });
      }
    });
  }
  if (path[path.length - 1][0] !== x || path[path.length - 1][1] !== y) path.push([x, y]);
  return { path, kills, t };
}
const origin = L => [L.shooter[0], L.shooter[1] - 160];


const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, sc, HL, oy, li = 0, ammo, dead, tNow = 0, shot = null, aim = null, state = 'play', dying = [];
function fit() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; sc = cv.width / 1080; HL = cv.height / sc; oy = (HL - 2340) / 2; }
addEventListener('resize', fit); fit();
const L = () => LEVELS[li];
function load(i) { li = (i + LEVELS.length) % LEVELS.length; ammo = 5; dead = []; shot = null; aim = null; state = 'play'; tNow = 0; }
load(0);
const brick = (x, y, w, h) => { // tijolo marrom-avermelhado com juntas e borda clara
  ctx.fillStyle = '#964a30'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#85402a';
  for (let r = Math.floor(y / 36) * 36; r < y + h; r += 36) { ctx.fillRect(x, Math.max(r, y), w, 3);
    for (let c = Math.floor(x / 120) * 120 + (Math.floor(r / 36) % 2 ? 60 : 0); c < x + w; c += 120) if (c >= x && r >= y) ctx.fillRect(c, r, 3, 36); }
};
function drawSky(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#aeb9d8'); g.addColorStop(1, '#c9bfd2');
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.fillStyle = 'rgba(190,160,190,.55)'; for (let i = 0; i < 9; i++) { const bx = x0 + 40 + i * 130, bh = 150 + (i * 97) % 260; ctx.fillRect(bx, y1 - bh, 90, bh); }
  ctx.restore();
}
function person(x, y, kind, facing, deadT) {
  ctx.save(); ctx.translate(x, y);
  if (deadT !== undefined) { ctx.rotate(Math.min(1.4, (tNow - deadT) * 5) * (x > 540 ? 1 : -1)); }
  if (kind === 'e') {
    ctx.fillStyle = '#23212a'; ctx.fillRect(-26, -80, 20, 80); ctx.fillRect(6, -80, 20, 80); // pernas
    ctx.fillRect(-44, -150, 88, 74); // jaqueta
    ctx.fillStyle = '#e8e8ea'; ctx.fillRect(-12, -146, 24, 60); // camisa
    ctx.fillStyle = '#b07a5e'; ctx.beginPath(); ctx.arc(0, -172, 24, 0, 7); ctx.fill(); // cabeça
    ctx.fillStyle = '#2a2328'; ctx.fillRect(-24, -196, 48, 14);
  } else { // barril explosivo vermelho
    ctx.fillStyle = '#d8281f'; ctx.fillRect(-40, -130, 80, 130); ctx.fillStyle = '#8f1710'; ctx.fillRect(-40, -100, 80, 10); ctx.fillRect(-40, -40, 80, 10);
  }
  ctx.restore();
}
function shooter(x, y, tx, ty) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#26232c'; ctx.fillRect(-24, -34, 20, 34); ctx.fillRect(6, -34, 20, 34); // botas
  ctx.fillStyle = '#3a3a52'; ctx.fillRect(-26, -84, 52, 52); // short
  ctx.fillStyle = '#3252a8'; ctx.fillRect(-28, -140, 56, 60); // camisa azul
  ctx.fillStyle = '#ebbe46'; ctx.beginPath(); ctx.ellipse(0, -164, 26, 30, 0, 0, 7); ctx.fill(); // cabelo loiro
  ctx.fillStyle = '#c8a07e'; ctx.beginPath(); ctx.arc(0, -160, 15, 0, 7); ctx.fill();
  ctx.fillStyle = '#25243a'; ctx.fillRect(-30, -190, 60, 12); ctx.fillRect(-18, -204, 36, 16); // chapéu
  const a = Math.atan2(ty - (y - 160), tx - x); ctx.translate(0, -150); ctx.rotate(a); // arma
  ctx.fillStyle = '#2b2a2e'; ctx.fillRect(0, -7, 110, 14); ctx.fillStyle = '#6a4a2a'; ctx.fillRect(10, -4, 40, 8);
  ctx.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(sc, 0, 0, sc, 0, oy * sc);
  const l = L(), a = l.arena;
  const k = blocksAt(l, tNow), Sk = (() => { const o = l.open; return [o.l ? -200 : a[0], o.t ? -200 : a[1], o.r ? 1280 : a[2], a[3]]; })();
  ctx.fillStyle = '#964a30'; ctx.fillRect(-300, -300, 1700, 3200); brick(-300, -300, 1700, 3200);
  drawSky(Sk[0], Sk[1], Sk[2], Sk[3]);
  for (const b of k) { brick(b[0], b[1], b[2] - b[0], b[3] - b[1]); ctx.strokeStyle = '#c0755a'; ctx.lineWidth = 8; ctx.strokeRect(b[0] + 4, b[1] + 4, b[2] - b[0] - 8, b[3] - b[1] - 8); }
  ctx.strokeStyle = '#c0755a'; ctx.lineWidth = 12; ctx.strokeRect(Sk[0] + 6, Sk[1] + 6, Sk[2] - Sk[0] - 12, Sk[3] - Sk[1] - 12);
  if (l.open.l) ctx.clearRect(0, 0, 0, 0);
  l.targets.forEach((e, i) => { const p = tpos(e, dead[i] !== undefined ? dead[i] : tNow); person(p[0], p[1], e.t, 0, dead[i]); });
  const tx = aim ? aim[0] : l.shooter[0] + (l.shooter[0] < 540 ? 300 : -300), ty = aim ? aim[1] : l.shooter[1] - 160;
  shooter(l.shooter[0], l.shooter[1], tx, ty);
  if (aim && state === 'play' && !shot) { // linha pontilhada clara + mira dourada
    const r = simulate(l, tNow, origin(l), Math.atan2(aim[1] - origin(l)[1], aim[0] - origin(l)[0]), dead);
    ctx.setLineDash([22, 18]); ctx.strokeStyle = '#fff0b4'; ctx.lineWidth = 7; ctx.beginPath(); r.path.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#f8cd50'; ctx.lineWidth = 11; ctx.beginPath(); ctx.arc(aim[0], aim[1], 38, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(aim[0] - 56, aim[1]); ctx.lineTo(aim[0] + 56, aim[1]); ctx.moveTo(aim[0], aim[1] - 56); ctx.lineTo(aim[0], aim[1] + 56); ctx.stroke();
  }
  if (shot) { const p = shot.pos(); ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, 7); ctx.fill(); }
  // HUD
  ctx.fillStyle = '#fff'; ctx.font = 'bold 54px sans-serif'; ctx.fillText('←  Fase Normal ' + l.n, 30, 145);
  ctx.fillStyle = '#2f8be0'; ctx.fillRect(950, 120, 100, 100);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(330, 260, 420, 130);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i < ammo ? '#f6c844' : '#555'; ctx.fillRect(360 + i * 80, 290, 30, 70); }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(820, 2130, 220, 90); ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('Pular ›', 850, 2190);
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(-10, -10, 1100, 2400);
    ctx.fillStyle = '#e9a84a'; ctx.font = 'bold 120px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(state === 'win' ? 'Vitória' : 'Derrota', 540, 1000);
    ctx.fillStyle = '#fff'; ctx.font = '48px sans-serif'; ctx.fillText('Toque para ' + (state === 'win' ? 'a próxima fase' : 'tentar de novo'), 540, 1180); ctx.textAlign = 'left';
  }
}
function fire() {
  const l = L(), o = origin(l), r = simulate(l, tNow, o, Math.atan2(aim[1] - o[1], aim[0] - o[0]), dead);
  let d = 0; const seg = [], tt = [0]; for (let i = 1; i < r.path.length; i++) { const q = Math.hypot(r.path[i][0] - r.path[i - 1][0], r.path[i][1] - r.path[i - 1][1]); d += q; seg.push(q); }
  const total = r.t - tNow, t0 = tNow;
  shot = { t0, total, pos() { let f = Math.min(1, (tNow - t0) / total) * d, i = 0; while (i < seg.length - 1 && f > seg[i]) { f -= seg[i]; i++; } const p = r.path[i], q = r.path[i + 1] || p; const u = seg[i] ? f / seg[i] : 0; return [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]; }, kills: r.kills.slice() };
  ammo--; aim = null;
}
let last = performance.now();
function frame(n) {
  const dt = Math.min(0.05, (n - last) / 1000); last = n; tNow += dt;
  if (shot) {
    shot.kills = shot.kills.filter(k => { if (tNow >= shot.t0 + (k.t - shot.t0)) { dead[k.i] = k.t; return false; } return true; });
    if (tNow >= shot.t0 + shot.total) { shot = null; if (dead.filter(x => x !== undefined).length === L().targets.length) state = 'win'; else if (ammo <= 0) state = 'lose'; }
  }
  draw(); requestAnimationFrame(frame);
}
const pt = e => [e.clientX / innerWidth * 1080, e.clientY / innerHeight * HL - oy];
cv.addEventListener('pointerdown', e => {
  const p = pt(e);
  if (state !== 'play') { load(state === 'win' ? li + 1 : li); return; }
  if (p[1] > 2100 && p[0] > 800) { load(li + 1); return; }
  if (p[1] < 230 && p[0] < 700) { load(li - 1); return; }
  if (p[1] < 230 && p[0] > 930) { load(li); return; }
  if (!shot && ammo > 0) { aim = p; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => { if (aim && !shot) aim = pt(e); });
cv.addEventListener('pointerup', () => { if (aim && !shot) fire(); });
requestAnimationFrame(frame);
</script></body></html>
